<!doctype html>
<html lang="en"><head><title>computah preview card</title><meta charset="utf-8"><style>
:root { --words: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --ui: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; --stripes: repeating-linear-gradient(#000 0 2px, #fff 2px 4px); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #8a8a8a; color: #000; -webkit-font-smoothing: antialiased; }
.menubar { position: absolute; inset: 0 0 auto 0; height: 44px; background: #fff; border-bottom: 2px solid #000; display: flex; align-items: center; gap: 34px; padding: 0 30px; font: 700 21px/1 var(--ui); }
.menubar .right { margin-left: auto; font-weight: 400; }
.card { position: absolute; left: 64px; top: 88px; width: 700px; height: 484px; background: #fff; border: 2px solid #000; outline: 2px solid #fff; box-shadow: 0 0 0 4px #000, 10px 10px 0 4px #000; padding: 34px 48px; }
h1 { margin: 0; font: 400 124px/1 var(--words); letter-spacing: -3px; }
.tag { margin: 10px 0 0; font: italic 38px/1.2 var(--words); }
hr { border: 0; border-top: 2px solid #000; margin: 30px 0 26px; }
.say { margin: 0; max-width: 462px; font: 30px/1.36 var(--words); }
.window { position: absolute; left: 606px; top: 300px; width: 548px; background: #fff; border: 2px solid #000; box-shadow: 8px 8px 0 #000; }
.titlebar { height: 40px; border-bottom: 2px solid #000; padding: 7px 5px; background: var(--stripes) content-box; display: flex; justify-content: center; align-items: center; position: relative; }
.titlebar span { background: #fff; padding: 0 14px; font: 700 23px/26px var(--ui); }
.close { position: absolute; left: 16px; top: 7px; width: 26px; height: 26px; background: #fff; border: 2px solid #000; box-shadow: 0 0 0 3px #fff; }
.done { display: flex; gap: 14px; align-items: baseline; padding: 16px 22px 14px; border-bottom: 2px dotted #000; font: 25px/1.3 var(--words); }
.done i { flex: none; width: 15px; height: 15px; background: #000; transform: translateY(-1px); }
.done b { margin-left: auto; font: 400 19px/1 var(--ui); }
.ask { padding: 20px 22px 22px; }
.field { border: 2px solid #000; box-shadow: 0 0 0 2px #000; padding: 13px 16px; font: 29px/1.3 var(--words); min-height: 66px; }
.caret { display: inline-block; width: 3px; height: 32px; background: #000; vertical-align: -6px; margin-left: 3px; }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; font: 19px/1 var(--ui); }
.pill { border: 2px solid #000; border-radius: 12px; padding: 9px 20px; font: 700 21px/1 var(--ui); background: #fff; }
.send { border-radius: 14px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #000; margin-right: 6px; }
</style></head><body>
<div class="menubar"><span>computah</span><span>cards</span><span>find</span><span class="right">computah.sh</span></div>
<div class="card">
  <h1>computah</h1>
  <p class="tag">make this app better</p>
  <hr>
  <p class="say">a little window you put in your app. type what you want to be different and your coding agent edits the code</p>
</div>
<div class="window">
  <div class="titlebar"><div class="close"></div><span>improvements</span></div>
  <div class="done"><i></i><span>turn the counter into a stopwatch</span><b>done</b></div>
  <div class="ask">
    <div class="field">make it rain cats<span class="caret"></span></div>
    <div class="row"><span class="pill">point at it</span><span>only you will see it</span><span class="pill send">Send</span></div>
  </div>
</div>
</body></html>
